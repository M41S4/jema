
server:
  port: 8081

spring:
  application:
    name: bd_jema

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  datasource:
    mysql:
      url: jdbc:mysql://localhost:3306/bd_jema_usuarios
      username: root
      password: ""
      driver-class-name: com.mysql.cj.jdbc.Driver
